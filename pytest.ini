[pytest]
# `backend` on the path so the application imports as `app.*` in tests, in the
# eval harness and under uvicorn alike, with no editable install step.
pythonpath = backend
testpaths = backend/tests eval
python_files = test_*.py
addopts = -q --strict-markers
markers =
    llm: exercises a live model provider, skipped unless one is configured
    slow: heavier than a unit test, for example loading an embedding model
