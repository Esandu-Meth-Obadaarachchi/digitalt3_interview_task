# The interface and the API on one origin.
#
# The browser only ever talks to this server, so there is no cross-origin
# request to configure and CORS_ORIGINS stops mattering in the container. The
# dev setup proxies the same two prefixes through Vite, so what a reviewer sees
# behind nginx is what a developer sees behind Vite.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extraction over a long transcript and an agent loop both run for
        # minutes. The default 60s gateway timeout would cut them off and
        # report it as a server error, which describes the wrong problem.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
